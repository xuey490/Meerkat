# Linux / deploy template. agent_id is written once on first monitor-agent start.
# Leave labels.environment, site, or role empty to get test / local / $GOOS.
agent_id: "replace-with-stable-ulid"
agent_version: "1.0.0"
config_version: "local-1"
labels:
  environment: production
  site: shanghai
  role: web
listen_address: "127.0.0.1:9510"
server_address: "monitor.company.example:443"
# 手动指定上报 IP（用于云服务器公网 IP 场景，不配置则自动探测网卡 IP）
# report_ip: "1.2.3.4"
insecure_tls: false
ca_file: "/etc/monitor-agent/ca.pem"
cert_file: "/etc/monitor-agent/client.pem"
key_file: "/etc/monitor-agent/client-key.pem"
state_directory: "/var/lib/monitor-agent"
heartbeat_interval: 5s
reconnect_max: 30s
max_spool_bytes: 1073741824
max_spool_age: 24h
max_backlog_batches: 10
max_backlog_parallel: 1
backlog_rate_bytes_per_second: 1048576
retry_base: 1s
retry_max: 5m
health_address: "127.0.0.1:9511"
telegraf_binary: "/usr/bin/telegraf"
telegraf_service: "telegraf"
telegraf_check_interval: 5s
auto_recover_telegraf: true
